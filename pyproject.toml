[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gpo"
version = "2.0.0"
description = "Gaussian process operators: exact inference, stochastic dual descent and pathwise (Matheron) posterior sampling for operator learning"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Sawan Kumar" }, { name = "Rajdip Nayek" }, { name = "Souvik Chakraborty" }]
requires-python = ">=3.10"
dependencies = ["torch>=2.1", "numpy", "scipy", "h5py", "pytorch_wavelets", "PyWavelets"]

[project.optional-dependencies]
figures = ["matplotlib>=3.7", "imageio", "imageio-ffmpeg"]
test = ["pytest"]

[tool.setuptools.packages.find]
include = ["gpo*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
